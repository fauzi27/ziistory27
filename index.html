<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pesan Makanan Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans pb-24">

    <header class="bg-blue-600 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold" id="shop-title">WARUNG MieKopiEs</h1>
            <p class="text-[10px] text-blue-200">Pesan, Bayar QRIS, Tunggu Pesanan Jadi👌</p>
        </div>
        <i class="fas fa-utensils text-2xl opacity-80"></i>
    </header>

    <main class="p-4">
        <h2 class="font-bold text-gray-700 mb-3 flex items-center gap-2">
            <i class="fas fa-fire text-orange-500"></i> CEK MENU DULU
        </h2>
        
        <div id="category-tabs" class="flex gap-2 overflow-x-auto pb-2 mb-3 no-scrollbar"></div>

        <div id="loading-menu" class="text-center mt-10 text-gray-400 text-sm">
            <i class="fas fa-circle-notch fa-spin text-2xl text-blue-500 mb-2"></i><br>Memuat Menu...
        </div>

        <div class="grid grid-cols-2 gap-3" id="menu-container"></div>
    </main>

    <div class="fixed bottom-0 w-full bg-white border-t p-3 shadow-[0_-5px_15px_rgba(0,0,0,0.1)] z-40 flex justify-between items-center pb-safe">
        <div>
            <p class="text-[10px] text-gray-500 font-bold">Total Pesanan (<span id="cart-count">0</span> item)</p>
            <p class="text-xl font-bold text-blue-600 leading-tight" id="cart-total">Rp 0</p>
        </div>
        <button onclick="showCheckout()" class="bg-green-500 hover:bg-green-600 text-white px-5 py-2.5 rounded-xl font-bold shadow-lg transition active:scale-95 flex items-center gap-2 text-sm">
            Checkout <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <div id="checkout-modal" class="fixed inset-0 bg-black bg-opacity-80 hidden z-[100] flex items-center justify-center p-4 backdrop-blur-sm overflow-y-auto">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl flex flex-col my-auto relative">
            
            <button onclick="closeCheckout()" class="absolute top-3 right-3 text-gray-400 hover:text-red-500 bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center">
                <i class="fas fa-times"></i>
            </button>

            <div class="p-4 border-b text-center">
                <h3 class="font-bold text-lg text-gray-800">Selesaikan Pesanan</h3>
            </div>
            
            <div class="p-5 overflow-y-auto max-h-[65vh]">
                
                <div class="bg-blue-50 border border-blue-100 rounded-xl p-3 mb-4 text-center shadow-sm">
                    <p class="text-[10px] font-bold text-blue-800 uppercase">Nomor Antrean Anda</p>
                    <p class="text-2xl font-black text-blue-600 tracking-widest" id="display-queue">-</p>
                </div>

                <input type="text" id="cust-name" placeholder="Nama Anda" class="w-full p-3 border rounded-lg mb-3 bg-gray-50 outline-none focus:border-blue-500 text-sm font-bold">
                
                <textarea id="cust-note" rows="2" placeholder="Catatan (opsional), cth: sedap goreng, sedap soto, indomie goreng dan lain" class="w-full p-3 border rounded-lg mb-4 bg-gray-50 outline-none focus:border-blue-500 text-sm"></textarea>

                <div id="receipt-content" class="bg-white p-4 font-mono text-sm border-2 border-dashed border-gray-300 rounded-lg mb-4">
                </div>

                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 text-center">
                    <p class="text-xs font-bold text-blue-800 mb-1">SCAN QRIS UNTUK MEMBAYAR</p>
                    <p class="text-2xl font-extrabold text-blue-600 mb-3" id="qris-amount">Rp 0</p>
                    <img id="qris-image" src="" alt="QRIS" class="w-48 h-48 mx-auto rounded-lg shadow-sm border p-2 bg-white object-contain">
                    <p class="text-[10px] text-gray-500 mt-2">*Pastikan nominal sesuai sebelum membayar</p>
                    <p class="text-[10px] text-red-500 mt-2">*tekan gambar untuk download</p>
                </div>
            </div>
            
            <div class="p-4 bg-gray-50 border-t rounded-b-2xl">
                <button onclick="processOrder()" class="w-full bg-green-600 text-white py-3.5 rounded-xl font-bold shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
                    <i class="fab fa-whatsapp text-xl"></i> Konfirmasi & Kirim Bukti
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
