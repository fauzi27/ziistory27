<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZII Character Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        .aspect-portrait { aspect-ratio: 3 / 4; }
        .output-card { @apply bg-white p-3 rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition; }
        .output-label { @apply text-xs font-bold text-gray-600 mb-2 text-center bg-gray-50 py-1 rounded; }
        .output-image-container { @apply w-full bg-gray-100 rounded-lg overflow-hidden relative flex items-center justify-center border-2 border-dashed border-gray-200; }
        .loading-pulse { @apply animate-pulse bg-gray-300 border-none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800 pb-20">

    <header class="bg-white shadow-sm py-6 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 text-center">
            <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">
                <i class="fas fa-wand-magic-sparkles mr-2"></i>AI Character Creator
            </h1>
            <p class="text-gray-500 mt-2">Generate variasi pose dan emosi dari satu prompt.</p>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-10">
        <section class="bg-white rounded-2xl shadow-md p-6">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fas fa-layer-group text-blue-500"></i> Input Basis & Prompt</h2>
            <div class="flex flex-col md:flex-row gap-6">
                <div class="w-full md:w-1/3 flex-none">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Foto Referensi (Opsional)</label>
                    <div class="relative group">
                        <input type="file" id="base-image-upload" accept="image/*" class="hidden" onchange="handleFileUpload(event)">
                        <label for="base-image-upload" class="aspect-square rounded-xl border-2 border-dashed border-gray-300 hover:border-blue-500 bg-gray-50 flex flex-col items-center justify-center cursor-pointer transition overflow-hidden relative">
                            <div id="upload-placeholder" class="text-center p-4">
                                <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-2"></i>
                                <p class="text-sm text-gray-500 font-medium">Klik upload foto</p>
                            </div>
                            <img id="base-image-preview" src="" class="hidden w-full h-full object-cover absolute inset-0">
                        </label>
                        <button id="remove-base-image" onclick="removeBaseImage()" class="hidden absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-8 h-8 items-center justify-center shadow-lg hover:bg-red-600 z-10"><i class="fas fa-times"></i></button>
                    </div>
                </div>

                <div class="flex-1 flex flex-col">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Deskripsi Karakter (Wajib Detail!)</label>
                    <textarea id="prompt-input" rows="6" class="w-full p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none flex-1" placeholder="Contoh: 1girl, young warrior, silver armor, red hair ponytail, green eyes, fantasy setting, masterpiece, highly detailed..."></textarea>
                </div>
            </div>
            <button onclick="generateAll()" id="btn-generate" class="w-full mt-6 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-4 rounded-xl text-lg shadow-lg transition transform active:scale-[0.99] flex items-center justify-center gap-3">
                <i class="fas fa-rocket text-xl"></i> GENERATE SEMUA VARIASI
            </button>
        </section>

        <section>
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2 px-2"><i class="fas fa-camera-rotate text-purple-500"></i> Sudut Pandang</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="output-card"><div class="output-label">Depan</div><div id="view-front" class="output-image-container aspect-portrait"><i class="fas fa-image text-3xl text-gray-300"></i></div></div>
                <div class="output-card"><div class="output-label">Belakang</div><div id="view-back" class="output-image-container aspect-portrait"><i class="fas fa-image text-3xl text-gray-300"></i></div></div>
                <div class="output-card"><div class="output-label">Samping Kiri</div><div id="view-left" class="output-image-container aspect-portrait"><i class="fas fa-image text-3xl text-gray-300"></i></div></div>
                <div class="output-card"><div class="output-label">Samping Kanan</div><div id="view-right" class="output-image-container aspect-portrait"><i class="fas fa-image text-3xl text-gray-300"></i></div></div>
            </div>
        </section>

        <section>
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2 px-2"><i class="fas fa-masks-theater text-pink-500"></i> Variasi Emosi</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="output-card"><div class="output-label">Senang</div><div id="emo-happy" class="output-image-container aspect-square"><i class="fas fa-face-smile text-3xl text-gray-300"></i></div></div>
                <div class="output-card"><div class="output-label">Sedih</div><div id="emo-sad" class="output-image-container aspect-square"><i class="fas fa-face-sad-tear text-3xl text-gray-300"></i></div></div>
                <div class="output-card"><div class="output-label">Marah</div><div id="emo-angry" class="output-image-container aspect-square"><i class="fas fa-face-angry text-3xl text-gray-300"></i></div></div>
                <div class="output-card"><div class="output-label">Terkejut</div><div id="emo-surprised" class="output-image-container aspect-square"><i class="fas fa-face-surprise text-3xl text-gray-300"></i></div></div>
                
                <div class="output-card"><div class="output-label">Kecewa</div><div id="emo-disappointed" class="output-image-container aspect-square"><i class="fas fa-face-frown-open text-3xl text-gray-300"></i></div></div>
                <div class="output-card"><div class="output-label">Takut</div><div id="emo-scared" class="output-image-container aspect-square"><i class="fas fa-face-flushed text-3xl text-gray-300"></i></div></div>
                <div class="output-card"><div class="output-label">Jijik</div><div id="emo-disgusted" class="output-image-container aspect-square"><i class="fas fa-face-grimace text-3xl text-gray-300"></i></div></div>
                <div class="output-card"><div class="output-label">Netral</div><div id="emo-neutral" class="output-image-container aspect-square"><i class="fas fa-face-meh text-3xl text-gray-300"></i></div></div>
            </div>
        </section>
    </main>

    <footer class="bg-white py-4 text-center text-gray-500 text-sm fixed bottom-0 w-full border-t">
        <p>© 2026 AI Character Studio</p>
    </footer>

    <script>
        // Logika UI Upload Foto (Visual Only)
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('base-image-preview').src = e.target.result;
                    document.getElementById('base-image-preview').classList.remove('hidden');
                    document.getElementById('upload-placeholder').classList.add('opacity-0');
                    document.getElementById('remove-base-image').classList.replace('hidden', 'flex');
                }
                reader.readAsDataURL(file);
            }
        }

        function removeBaseImage() {
            document.getElementById('base-image-upload').value = '';
            document.getElementById('base-image-preview').src = '';
            document.getElementById('base-image-preview').classList.add('hidden');
            document.getElementById('upload-placeholder').classList.remove('opacity-0');
            document.getElementById('remove-base-image').classList.replace('flex', 'hidden');
        }

        // LOGIKA AI GENERATOR (SISTEM ANTREAN / SEQUENTIAL)
        async function generateAll() {
            const basePrompt = document.getElementById('prompt-input').value.trim();
            if (!basePrompt) {
                alert("Tolong isi deskripsi karakter (Prompt) terlebih dahulu!");
                return;
            }

            const btn = document.getElementById('btn-generate');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin text-xl"></i> MEMPROSES ANTREAN...';
            btn.disabled = true;

            // 1. Buat SEED acak
            const seed = Math.floor(Math.random() * 9999999);
            
            // 2. Daftar antrean gambar
            const tasks = [
                { id: 'view-front', prompt: `${basePrompt}, full body, front view, facing camera, character sheet` },
                { id: 'view-back', prompt: `${basePrompt}, full body, back view, viewed from behind, character sheet` },
                { id: 'view-left', prompt: `${basePrompt}, full body, looking left, side profile view, character sheet` },
                { id: 'view-right', prompt: `${basePrompt}, full body, looking right, side profile view, character sheet` },
                { id: 'emo-happy', prompt: `${basePrompt}, extreme close up face portrait, very happy expression, bright smile, joyful` },
                { id: 'emo-sad', prompt: `${basePrompt}, extreme close up face portrait, sad expression, crying, tears, depressing` },
                { id: 'emo-angry', prompt: `${basePrompt}, extreme close up face portrait, very angry expression, furious, shouting` },
                { id: 'emo-surprised', prompt: `${basePrompt}, extreme close up face portrait, surprised expression, wide eyes, shocked` },
                { id: 'emo-disappointed', prompt: `${basePrompt}, extreme close up face portrait, disappointed expression, sighing, looking down` },
                { id: 'emo-scared', prompt: `${basePrompt}, extreme close up face portrait, scared expression, terrified, fearful eyes` },
                { id: 'emo-disgusted', prompt: `${basePrompt}, extreme close up face portrait, disgusted expression, grossed out, wrinkling nose` },
                { id: 'emo-neutral', prompt: `${basePrompt}, extreme close up face portrait, neutral expression, serious, calm face` }
            ];

            // 3. Ubah semua kotak jadi mode "Menunggu"
            tasks.forEach(task => {
                const container = document.getElementById(task.id);
                container.innerHTML = '<div class="flex flex-col items-center"><i class="fas fa-hourglass-half text-xl text-gray-400"></i><span class="text-[10px] mt-2 text-gray-400 font-bold">Mengantre...</span></div>';
                container.classList.add('loading-pulse');
                container.classList.remove('border-dashed');
            });

            // 4. Proses satu per satu menggunakan Async/Await
            for (let i = 0; i < tasks.length; i++) {
                const task = tasks[i];
                const container = document.getElementById(task.id);
                
                // Update status kotak yang sedang diproses
                container.innerHTML = '<div class="flex flex-col items-center"><i class="fas fa-circle-notch fa-spin text-2xl text-blue-500"></i><span class="text-[10px] mt-2 text-blue-500 font-bold">Generating...</span></div>';

                // Kita buat Promise agar browser menunggu gambar ini selesai didownload sebelum lanjut ke gambar berikutnya
                await new Promise((resolve) => {
                    const encodedPrompt = encodeURIComponent(task.prompt);
                    const isView = task.id.includes('view');
                    const width = isView ? 512 : 512;
                    const height = isView ? 768 : 512;

                    const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?seed=${seed}&width=${width}&height=${height}&nologo=true`;

                    const img = new Image();
                    img.src = imageUrl;
                    img.className = 'w-full h-full object-cover rounded-lg opacity-0 transition-opacity duration-500';

                    // Jika sukses
                    img.onload = () => {
                        container.innerHTML = ''; 
                        container.classList.remove('loading-pulse');
                        container.appendChild(img);
                        setTimeout(() => img.classList.remove('opacity-0'), 50);
                        resolve(); // Lanjut ke antrean berikutnya!
                    };

                    // Jika gagal
                    img.onerror = () => {
                        container.classList.remove('loading-pulse');
                        container.innerHTML = '<span class="text-xs text-red-500 text-center px-2">Gagal memuat gambar</span>';
                        resolve(); // Tetap lanjut ke antrean berikutnya meskipun ini gagal
                    };
                });
            }

            // Selesai semua antrean
            btn.innerHTML = '<i class="fas fa-rocket text-xl"></i> GENERATE SEMUA VARIASI';
            btn.disabled = false;
        }
    </script>

</body>
</html>
